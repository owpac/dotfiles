# Example kompose lint configuration.
# Reproduces the rules that were previously hardcoded in lint.py
# (with exclusions migrated from .komposeignore).
#
# Copy this file to: <host>/.kompose/rules.yaml
# (e.g. /mnt/home/thomas/workspace/homelab/nas/.kompose/rules.yaml)
#
# See the README for the full schema reference.

globals:
  public_domain: owpac.com
  private_domain: owpac.net
  proxy_network: reverse-proxy
  public_middleware: wan@file
  private_middleware: lan@file

rules:
  # Property order — alphabetical convention enforced on common compose keys.
  # warn_on_unknown defaults to true → any YAML key not in `order:` becomes a
  # warning. Either add the key to `order:` to canonicalize it, or set
  # `warn_on_unknown: false` to silence.
  - name: property-order
    category: structure
    type: property_order
    severity: warning
    params:
      order:
        - cap_add
        - command
        - container_name
        - depends_on
        - deploy
        - devices        # mount host device(s) into the container (e.g. /dev/dri for GPU passthrough)
        - entrypoint
        - env_file
        - environment
        - group_add      # add the container process to additional host GIDs (e.g. 107=render, 44=video for GPU device access)
        - healthcheck
        - hostname       # internal hostname; affects inter-container DNS + 'hostname' command inside
        - image
        - labels
        - logging
        - network_mode
        - networks
        - pid
        - ports
        - privileged
        - restart
        - stdin_open     # keep STDIN open (= docker -i); needed by 'docker attach' for interactive input
        - tty            # allocate pseudo-TTY (= docker -t); pair with stdin_open for full terminal behavior
        - user
        - volumes

  # Traefik router naming: public hosts must use -private/-public suffix.
  - name: traefik-router-naming
    category: traefik
    handler: traefik_router_naming
    exclude:
      - opencloud-webdav

  # Public routers must use wan@file; private routers must use lan@file.
  - name: traefik-middleware-correlation
    category: traefik
    handler: traefik_middleware_correlation
    exclude:
      - opencloud-webdav

  # Each compose file must declare local logging.
  - name: logging-driver
    category: logging
    type: substring_required
    severity: warning
    exclude:
      - network
    params:
      required:
        - "logging:"
        - "driver: local"

  # Each service must join the reverse-proxy network or use network_mode.
  - name: reverse-proxy-network
    category: network
    handler: reverse_proxy_network

  # Verifies <host>/compose.yml include: stays in sync with service dirs.
  # - per-service issue: dir exists but not in includes (e.g. forgot to add)
  # - host-wide notice: include path points to a missing file
  - name: compose-includes-sync
    category: compose
    handler: compose_includes_sync
    exclude:
      - network        # infra service, intentionally outside the root project
      - minecraft      # temporary service
      - sure           # WIP scratch dir
    params:
      root: compose.yml

  # Per-service .env / .env.example drift (vars + structure). Surfaces the
  # same information `kompose fix --env` would prompt you to reconcile.
  - name: env-check
    category: env
    handler: env_check
    severity: warning
    exclude: []
