# The module pac: the CLI that upgrades each machine (owpac/pac). mise installs it with uv, in its
# own venv, from its private GitHub repository. mise 2026.10.19 or later lists a private
# repository with `git ls-remote` over SSH, so no GitHub token is necessary. On the NAS, ssh
# forwards the 1Password agent of the Mac (ForwardAgent).
# A machine without access to this repository turns off the module: mise vars modules_off="pac"

[tools]
# Python stays on one minor version. mise installs the Python tools with the link python/3.15. A
# new patch version keeps their venv, but a new minor version breaks it. The hook below then
# reinstalls the tool. The module kompose declares the same versions.
python = "3.15"
uv = "latest"
# On github.com, `latest` is the last tag. The workflow tag.yml of the repository tags each push on
# main, so `mise upgrade` installs each push. postinstall writes the zsh completion of each new
# version.
"pypi:git+ssh://git@github.com/owpac/pac.git" = { version = "latest", postinstall = 'mkdir -p "$HOME/.local/bin/completions" && pac --completion zsh > "$HOME/.local/bin/completions/_pac"' }

# A new minor version of Python breaks the venv of a Python tool, and mise does not reinstall the
# tool. So reinstall pac if it does not start. mise runs the hooks of each config file.
[bootstrap.hooks.post-tools]
run = '''
if ! mise exec -- pac --version >/dev/null 2>&1; then
  echo "Reinstalling pac on the Python of mise..."
  mise install --force "pypi:git+ssh://git@github.com/owpac/pac.git"
fi
'''
