# The global config of fnox: the secrets of owpac, encrypted with age. mise links this file from
# the module secrets, so `fnox set --global` writes the encrypted value into this repository. A
# value is ciphertext: it is safe in a public repository.
#
# Add a secret. fnox asks for the value, and does not show it:
#   fnox set <NAME> --global --provider age
# Add a secret of Doctolib, for the role work only:
#   fnox set <NAME> --global --profile doctolib --provider age
# Run a command with the secrets:
#   fnox exec -- <command>
# Edit a secret in your editor, also a value on several lines. fnox opens only this value, and
# writes the change into this file:
#   fnox edit <NAME> [--profile doctolib]
# Add a file that mise writes at its path (mode = "fnox" in a module), from its current content:
#   fnox set --file <path> --provider age
# Edit this file, then write it again: mise dot edit --apply <path>

# No secret enters the interactive shell: a command gets the secrets only with fnox exec.
env = "exec"

# The provider age is in age.toml, a template of mise: the public key of the provider comes from
# 1Password, so this repository does not hold it. One file cannot be a link (for fnox set) and a
# template (for the key) at the same time.
import = ["age.toml"]

# Files that mise writes at their path (mode = "fnox" in the module doctolib). They are in no
# profile: mise runs fnox get --file without --profile. A file is never an environment variable.
[files]
"~/.workrc"= { provider = "age", value = "" }
"~/.npmrc"= { provider = "age", value = "" }

[secrets]

[profiles]

[profiles.doctolib]

[profiles.doctolib.secrets]
ES_API_KEY= { provider = "age", value = "" }
DOCTOLIB_HOSTS= { env = false, description = "The local domains of Doctolib (task generate-hosts)", provider = "age", value = "" }

