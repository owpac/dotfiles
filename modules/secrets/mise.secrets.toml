# The module secrets: age, and the encryption key that decrypts the .age files of this repository
# (vars.age_identity in config.toml). 1Password holds the key.

[dotfile_groups.secrets]
root = "secrets/home"

[dotfile_groups.secrets.entries]
"~/.ssh/encryption_ed25519.pub" = { mode = "template", remove_empty = true, permissions = "0600" }
"~/.ssh/encryption_ed25519" = { mode = "template", remove_empty = true, permissions = "0600" }

[bootstrap.packages]
"brew:age" = "latest"
