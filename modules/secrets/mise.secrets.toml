# The module secrets: fnox, age, and the encryption key. 1Password holds the key.
#   - fnox keeps the secrets, encrypted with age in home/.config/fnox/config.toml. A command gets
#     them with fnox exec. The template age.toml adds the provider age, with the public key from
#     1Password.
#   - The key decrypts the secrets of fnox and the .age files of this repository
#     (vars.age_identity in config.toml).

[tools]
fnox = "latest"

[dotfile_groups.secrets]
root = "secrets/home"

[dotfile_groups.secrets.entries]
"~/.ssh/encryption_ed25519.pub" = { mode = "template", remove_empty = true, permissions = "0600" }
"~/.ssh/encryption_ed25519" = { mode = "template", remove_empty = true, permissions = "0600" }
"~/.config/fnox/age.toml" = { mode = "template", remove_empty = true }

[bootstrap.packages]
"brew:age" = "latest"
