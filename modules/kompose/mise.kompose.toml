# The module kompose: the CLI that manages the Docker services of the homelab (owpac/kompose). mise
# installs it as the module pac installs pac: see modules/pac/mise.pac.toml for the private
# repository.
# A machine without access to this repository turns off the module: mise vars modules_off="kompose"

# A git tag has no release date, so mise cannot check the delay of minimum_release_age, and it
# shows a warning at each install. The tags of this repository come from its own workflow, so
# the tool skips the delay. Its dependencies from PyPI also skip it.
[settings]
minimum_release_age_excludes = ["pypi:git+ssh://git@github.com/owpac/kompose.git"]

[tools]
# The same versions as the module pac: the Python tools of mise use the link python/3.15.
python = "3.15"
uv = "latest"
# On github.com, `latest` is the last tag. The workflow tag.yml of the repository tags each push on
# main, so `mise upgrade` installs each push. postinstall writes the zsh completion of each new
# version.
"pypi:git+ssh://git@github.com/owpac/kompose.git" = { version = "latest", postinstall = 'mkdir -p "$HOME/.local/bin/completions" && kompose --completion zsh > "$HOME/.local/bin/completions/_kompose"' }

# A new minor version of Python breaks the venv of a Python tool, and mise does not reinstall the
# tool. So reinstall kompose if it does not start.
[bootstrap.hooks.post-tools]
run = '''
if ! mise exec -- kompose --version >/dev/null 2>&1; then
  echo "Reinstalling kompose on the Python of mise..."
  mise install --force "pypi:git+ssh://git@github.com/owpac/kompose.git"
fi
'''
