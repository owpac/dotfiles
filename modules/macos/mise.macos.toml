# The module macos: the setup of macOS on a workstation. The macOS preferences, Touch ID for sudo,
# the package pam-reattach and its hooks, and the setup scripts of macOS (tasks/).
# Note: macos is also the name of a platform environment of mise. mise/miserc.toml sets
# auto_env = false, so mise loads this file only when the machine selects the module macos. With
# auto_env = true, mise loads this file on each Mac, whatever the roles of the machine.

# The setup scripts of macOS: macos-setup, macos-preferences and backups. The task bootstrap
# runs them. A relative path starts in this folder.
[task_config]
includes = ["tasks"]

[bootstrap.packages]
"brew:pam-reattach" = "latest"

# macOS preferences. mise bootstrap applies them on a Mac. The other platforms ignore them.
# mise writes each preference as `defaults write` does, and never deletes a preference: to go
# back to the default of macOS, remove the entry, then run `defaults delete <domain> <key>`.
# Check the state with `mise bootstrap macos defaults status`.
# The folders of the Dock (persistent-others) stay in the task macos-setup: the Dock adds keys to
# each folder tile, so a declared value always differs.

[bootstrap.macos.keyboard]
initial_key_repeat = 15
key_repeat = 2

[bootstrap.macos.dock]
autohide = true
autohide_delay = 0.0
tilesize = 48
largesize = 54
magnification = true
show_recents = false
apps = [
  "/Applications/Zen.app",
  "/System/Applications/Messages.app",
  "/Applications/Discord.app",
  "/Applications/Spark Desktop.app",
  "/Applications/1Password.app",
  "/Applications/Visual Studio Code.app",
  "/Applications/iTerm.app",
  "/System/Applications/System Settings.app",
]

[bootstrap.macos.defaults."com.apple.finder"]
# Disable Tags
ShowRecentTags = false
# Disable the automatic opening of a new tab in Finder when opening a folder
FinderSpawnTab = false
# Default folder of a new Finder window: PfHm = Home, PfDe = Desktop, PfLo = Last opened
# location, PfCm = Computer, PfVo = Volume
NewWindowTarget = "PfHm"

# Login items: mise adds the missing apps and keeps the others. work.toml adds MuteDeck.
[bootstrap.macos.login_items]
apps = [
  "/Applications/Raycast.app",
  "/Applications/1Password.app",
  "/Applications/iTerm.app",
  "/Applications/Rectangle.app",
  "/Applications/Elgato Wave Link.app",
  "/Applications/Elgato Stream Deck.app",
]

# Keyboard shortcuts (com.apple.symbolichotkeys). Each entry replaces one shortcut, as
# `defaults write ... -dict-add <id>` does, and keeps the other shortcuts.
# value.parameters = [character, key code, modifiers]. [65535, 65535, 0] means no key.
# --- Launchpad and Dock
# Activer ou désactiver le masquage du Dock - ENABLED (ALT + CMD + D)
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["52"]
value = { enabled = true, value = { parameters = [100, 2, 1572864], type = "standard" } }

