# Touch ID for sudo, in /etc/pam.d/sudo_local. Since macOS 14, /etc/pam.d/sudo includes this file,
# and the updates of macOS keep it (they replace /etc/pam.d/sudo). Same content and permissions as
# `mo touchid` (mole): owner root:wheel, mode 444. mise compares the file, and uses sudo only when
# the file differs. The other platforms ignore this entry (os).
# With the package pam-reattach, sudo_local also loads a root copy of pam_reattach. The hook
# post-packages below installs this copy: mise cannot copy a binary file.
# mise renders this template before the packages step: on a new machine, the second run of
# mise bootstrap adds pam_reattach.
[bootstrap.files."/etc/pam.d/sudo_local"]
os = "macos"
owner = "root"
group = "wheel"
mode = "0444"
template = true
content = """
# sudo_local: local customizations for sudo
{%- if "/opt/homebrew/lib/pam/pam_reattach.so" is file %}
auth       optional       /usr/local/lib/pam/pam_reattach.so ignore_ssh
{%- endif %}
auth       sufficient     pam_tid.so
"""

# pam_reattach (package pam-reattach) puts sudo back into the GUI session, so Touch ID also works
# in a terminal multiplexer such as herdr or tmux (sudo_local above). The Homebrew files
# belong to the user, so a program of the user could replace the module, and sudo would then
# load it as root. So this hook installs a copy that belongs to root, and sudo_local loads this
# copy. mise cannot do it: the source of a [bootstrap.files] entry must be UTF-8 text.
# The hook runs after the packages and before the system files: sudo_local must not load a module
# that does not exist.
[bootstrap.hooks.post-packages]
run = '''
module=/opt/homebrew/lib/pam/pam_reattach.so
copy=/usr/local/lib/pam/pam_reattach.so
if [ -e "$module" ] && ! cmp -s "$module" "$copy"; then
  echo "Installing a root copy of pam_reattach in $copy..."
  sudo install -d -m 755 -o root -g wheel "$(dirname "$copy")"
  sudo install -m 444 -o root -g wheel "$module" "$copy"
fi
'''

# Load the new keyboard shortcuts (above) without a new session. mise does not
# restart the Dock or the Finder: it gives a reminder when it changes their preferences.
[bootstrap.hooks.post-defaults]
run = "/System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u"

# pam-reattach is not installed: remove the root copy, after mise wrote a sudo_local that does not
# load it.
[bootstrap.hooks.final]
run = '''
copy=/usr/local/lib/pam/pam_reattach.so
if [ ! -e /opt/homebrew/lib/pam/pam_reattach.so ] && [ -e "$copy" ]; then
  sudo rm -f "$copy"
  sudo rmdir "$(dirname "$copy")" 2>/dev/null || true
  echo "Root copy of pam_reattach removed"
fi
'''
