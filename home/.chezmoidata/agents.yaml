# Shared data of the coding agents (Claude Code and Codex). The paths are relative to the home
# directory. The modify templates of ~/.claude/settings.json and ~/.codex/config.toml read it.
agents:
  # Plugins of the marketplace owpac. A plugin goes to both agents in every mode, unless its
  # options limit it:
  #   - agents: the agents that get the plugin (claude, codex).
  #   - work: true to enable the plugin in the work mode only.
  # chezmoi owns every plugin of owpac: a plugin that leaves this list also leaves the agents.
  # chezmoi does not manage the plugins of other marketplaces (for example claude-plugins-official
  # or doctolib): enable them by hand on each machine, with /plugin.
  plugins:
    productivity: {}
    python: {}
    rails: {}
    setup: {}
    beads: {}
    engram: {}
  # Beads: every task lives in this workspace.
  beads_dir: .local/share/tasks/.beads
  # Runtime clones of the plugin marketplaces. chezmoi clones them once (.chezmoiexternal),
  # and `pac upgrade agents` pulls them. Claude Code and Codex use them as local marketplaces.
  marketplaces_dir: .local/share/agent-marketplaces
