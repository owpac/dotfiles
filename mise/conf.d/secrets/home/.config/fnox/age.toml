{#- The provider age of fnox (import of config.toml). mise renders this template: the public key
    of ~/.ssh/encryption_ed25519 comes from 1Password, so this repository does not hold it.
    Without the CLI of 1Password (op), the template renders empty, and mise does not write the
    file (remove_empty). Until the next run of mise bootstrap, each fnox command then fails with
    "Import file not found". -#}
{%- if exec(command="command -v op || true") %}
[providers.age]
type = "age"
recipients = ["{{ exec(command="op read 'op://Personal/encryption_ed25519/public key'") }}"]
# The private key. 1Password holds it, and the module secrets deploys it.
key_file = "~/.ssh/encryption_ed25519"
{%- endif %}
