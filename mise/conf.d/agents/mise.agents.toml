# The module agents: the coding agents Claude Code, Codex, Beads and worktrunk. Their variables,
# packages, dotfiles and tasks. home/ holds the files of the group agents, and tasks/ the setup
# scripts.

[vars]
# The paths are relative to the home directory. Every task of Beads lives in this workspace.
beads_dir = ".local/share/tasks/.beads"
# The shared clones of the plugin marketplaces ([bootstrap.repos] below). Claude Code and Codex use
# them as local marketplaces.
marketplaces_dir = ".local/share/agent-marketplaces"
# The plugins of the marketplace owpac, separated by spaces. Both agents get them.
agent_plugins = "productivity python rails setup beads engram"
# The plugins of the marketplace owpac for the work mode only.
agent_plugins_work = ""

# worktrunk (wt) gives each agent its own git worktree. ~/.zshrc loads its shell integration.
[bootstrap.packages]
"brew:beads" = "latest"
"brew:gentleman-programming/tap/engram" = "latest"
"brew:worktrunk" = "latest"

# The marketplace owpac: one clone of owpac/prompts for Claude Code and Codex. mise clones it, and
# `mise bootstrap --update` and `pac upgrade agents` pull it. If the config enables a plugin that
# the clone does not have yet, run `mise bootstrap --update`. Do not edit this clone: a clone with
# local changes stops mise bootstrap.
# owpac/prompts is private, so git clones it over SSH, with the 1Password agent of ~/.ssh/config.
[bootstrap.repos]
"~/{{ vars.marketplaces_dir }}/owpac" = { url = "git@github.com:owpac/prompts.git" }

# mise clones the repositories before it writes the dotfiles. A repository cannot wait for a
# dotfile: [bootstrap.repos] has no depends. So on a new Mac, this hook writes the SSH config and
# the public key of the Mac (module ssh) before the first clone. The key comes from 1Password: on
# the first run of install.sh, 1Password is not ready, so the hook stops the run. install.sh
# expects this failure. When the clone exists, the hook does nothing.
# The codes \u001b[…m print the name in magenta and bold, the color of the module agents (see the
# task bootstrap), also in a pipe or with NO_COLOR.
[bootstrap.hooks.pre-repos]
description = "\u001b[1;35m[agents]\u001b[0m 🗝️ Write the SSH config if owpac is not cloned yet"
run = '''
if [ ! -d "$HOME/{{ vars.marketplaces_dir }}/owpac" ]; then
  mise dot apply --yes ~/.ssh/config ~/.ssh/mbp_ed25519.pub
fi
'''

# Claude Code, Codex, bd and wt also write their config file, so mise merges the keys of owpac
# into these files. A merge entry must be in [dotfiles]: a group deploys whole files only. A
# relative source starts in the folder of this file. The group agents excludes these sources, so
# it does not link them.
# mise dot add sorts the entries of a table: keep them sorted, and keep the comments above it.
[dotfiles]
"~/.claude" = { permissions = "0700" }
"~/.claude/settings.json/owpac" = { source = "home/.claude/settings.json", merge = true, template = "tera" }
"~/.codex/config.toml/owpac" = { source = "home/.codex/config.toml", merge = true, template = "tera" }
"~/.config/bd/config.yaml" = { permissions = "0600" }
"~/.config/bd/config.yaml/owpac" = { source = "home/.config/bd/config.yaml", merge = true }
"~/.config/worktrunk/config.toml/owpac" = { source = "home/.config/worktrunk/config.toml", merge = true }

[dotfile_groups.agents]
root = "agents/home"
exclude = [".claude/settings.json", ".codex/config.toml", ".config/bd/config.yaml", ".config/worktrunk/config.toml"]

[dotfile_groups.agents.entries]
# Codex reads the shared instructions in ~/.codex/AGENTS.md, a second link to the same source. An
# entry with a source in the group removes this source from the files that the group links, so
# ~/.config/ia/AGENTS.md needs its own entry.
"~/.config/ia/AGENTS.md" = {}
"~/.codex/AGENTS.md" = { source = ".config/ia/AGENTS.md" }
"~/.beads/redirect" = { mode = "template" }

# The tasks beads, codex-plugins and claude-token. A relative path starts in this folder.
[task_config]
includes = ["tasks"]
