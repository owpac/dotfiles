{#- The keys that mise sets in ~/.codex/config.toml (merge entry of mise.agents.toml).
  Codex also writes this file (for example the trust levels of the projects): its other keys and
  its comments stay. The Beads hooks come from the plugin beads@owpac.
    - shell_environment_policy.set: BEADS_ACTOR (agent name for bd) and BEADS_DIR (home
      workspace) for the commands that Codex runs.
    - sandbox_workspace_write: in the Auto preset, sandboxed bd commands can reach the shared Dolt
      server (127.0.0.1:3308), and write ~/.beads and the home workspace. Trade-off: sandboxed
      commands get network access.
    - Plugins: Codex clones each git marketplace itself. At the start of a session, Codex 0.166.0
      updates each marketplace, and the plugins of a marketplace that changed (in its source, not
      in its docs). Before the first session, the task codex-plugins clones the marketplaces:
      without a clone, `codex plugin list` fails. The task also installs the plugins that this
      file enables. `pac upgrade agents` runs `codex plugin marketplace upgrade`.
    - owpac: the private repository owpac/prompts. Git clones it over SSH, with the 1Password
      agent of ~/.ssh/config. If 1Password is locked, Codex shows an error after 30 s, and the
      session keeps the old version.
    - mise enables the plugins of vars.agent_plugins, and of vars.agent_plugins_work in the work
      mode. A merge entry does not remove a key: to remove a plugin, set enabled = false here.
    - worktrunk@worktrunk: the plugin of wt, from its git repository. -#}
{%- set plugins = vars.agent_plugins | split(pat=" ") -%}
{%- if "work" in (mise_env | default(value=[])) and vars.agent_plugins_work -%}
{%- set plugins = [...plugins, ...(vars.agent_plugins_work | split(pat=" "))] -%}
{%- endif -%}
[shell_environment_policy.set]
BEADS_ACTOR = "codex"
BEADS_DIR = "{{ env.HOME }}/{{ vars.beads_dir }}"

[sandbox_workspace_write]
network_access = true
writable_roots = ["{{ env.HOME }}/.beads", "{{ env.HOME }}/{{ vars.beads_dir | dirname }}"]

[marketplaces.owpac]
source_type = "git"
source = "git@github.com:owpac/prompts.git"

[marketplaces.worktrunk]
source_type = "git"
source = "https://github.com/max-sixty/worktrunk.git"
{% for plugin in plugins %}
[plugins."{{ plugin }}@owpac"]
enabled = true
{% endfor %}
[plugins."worktrunk@worktrunk"]
enabled = true
