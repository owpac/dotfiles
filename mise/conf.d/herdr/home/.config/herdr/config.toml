onboarding = false

[ui]
status_indicators = "symbols"
tab_bar_position = "top"
tab_bar_right = [{ type = "hostname" }, { type = "zoom" }]
pane_borders = "auto"                 # borders only between split panes ("always" also frames a lone pane)

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.toast]
# iTerm2 shows the notification (iTerm2 icon, a click brings iTerm2 to the front).
delivery = "terminal"

[ui.toast.herdr]
# Used only when delivery = "herdr" (in-app toasts). No center value: top-left, top-right,
# bottom-left or bottom-right.
position = "top-right"

[ui.toast.clipboard]
# No popup after a mouse copy. The copy stays on (ui.copy_on_select = true, pbcopy on macOS).
# copy_on_select = false makes Cmd+C copy, but iTerm2 takes Cmd+C for its own Copy menu.
enabled = false
position = "top-right"

# Keybindings
#
# All actions use the prefix (ctrl+space), then one key. The keys follow 5 rules:
#   1. In the iTerm2 "herdr" profile, the pane keys use cmd. AeroSpace uses Hyper (cmd+ctrl+alt)
#      for the windows, so the 2 sets of keys do not collide.
#        cmd+shift+arrow = focus (herdr: prefix+arrow).
#        cmd+i / j / k / l = focus too (herdr: prefix+i / j / k / l).
#        i = up, j = left, k = down, l = right.
#        cmd+up / cmd+down = focus too. cmd+left / cmd+right stay the start / end of the line.
#        cmd+alt+arrow = move the pane (herdr: prefix+shift+arrow). run_once_macos_config turns off
#        the macOS keys on cmd+alt+arrow (Mission Control and Spaces).
#        cmd+enter = fullscreen pane (herdr: prefix+f). AeroSpace puts a window in fullscreen (Hyper+f).
#      The iTerm2 panes use the same keys (global key bindings, snapshot of `pac preferences`):
#      cmd+shift+arrow = "Select Split Pane", cmd+alt+arrow = "Swap With Split Pane".
#      Resize mode: prefix+minus or prefix+=, then the arrows or h j k l (herdr fixes h j k l).
#   2. Splits use the iTerm2 keys: d splits on the right and shift+d splits below. x closes.
#   3. Tabs use the browser and VS Code keys: t, w, r, 1..9.
#      Shift + the same key does the same action on the workspace.
#      Thus t = new tab and T = new workspace, w = close tab and W = close workspace.
#   4. ctrl + arrow selects a tab or a workspace, in the direction of the screen layout:
#      ctrl+right / ctrl+left = next / previous tab (the tab bar is horizontal).
#      ctrl+down / ctrl+up = next / previous workspace (the sidebar list is vertical).
#   5. p opens herdr-bar, like cmd+p (quick open) in VS Code.
#
# In the iTerm2 "herdr" profile, cmd + key sends the prefix + the same key.
# Exceptions: cmd+c, cmd+v, cmd+n, cmd+s and cmd+q stay macOS keys.
# cmd+f searches in the focused pane: the profile sends prefix+y (copy mode), then / (search).
# The iTerm2 search sees only the screen of herdr, not the history of each pane.
# ctrl+tab / ctrl+shift+tab send prefix+ctrl+right / left (tabs).
# ctrl+alt+tab / ctrl+alt+shift+tab send prefix+ctrl+down / up (workspaces).
# On AZERTY, ctrl+& ... ctrl+ç select tabs 1..9 (cmd + digit stays for the iTerm2 tabs).
# With the prefix, use shift: ctrl+space shift+& = tab 1.
# cmd+< (the key left of W) changes to the Default profile (iTerm2 keys).
# A global iTerm2 key binding on cmd+< comes back.
# scripts/make-iterm-profile writes the "herdr" iTerm2 dynamic profile.
# To remove all the keybindings below, run `herdr config reset-keys`.
# To apply a change, press ctrl+space ; or run `herdr server reload-config`.
[keys]
# The macOS input source shortcut (ctrl+space) is off on this Mac, so the key is free.
prefix = "ctrl+space"
# Old prefix, kept as a fallback during the test of ctrl+space.
extra_prefixes = ["ctrl+b"]

# General
help = "prefix+?"
settings = "prefix+comma"             # cmd+, in macOS apps
reload_config = "prefix+;"            # the key next to ","
detach = "prefix+q"                   # quit the client, like cmd+q. The agents continue.
toggle_sidebar = "prefix+b"           # VS Code cmd+b
goto = "prefix+g"                     # search the agents and the terminals
open_notification_target = "prefix+o" # open the agent that needs attention
next_agent = "prefix+a"               # alt+tab in the iTerm2 "herdr" profile
previous_agent = "prefix+shift+a"     # alt+shift+tab in the iTerm2 "herdr" profile
workspace_picker = "prefix+space"     # the sidebar calls workspaces "spaces"
edit_scrollback = "prefix+e"
copy_mode = "prefix+y"                # vim yank

# Panes: AeroSpace windows and iTerm2 splits
focus_pane_left = ["prefix+left", "prefix+j"]   # iTerm2: cmd+shift+arrow, cmd+i/j/k/l, cmd+up/down.
focus_pane_down = ["prefix+down", "prefix+k"]
focus_pane_up = ["prefix+up", "prefix+i"]
focus_pane_right = ["prefix+right", "prefix+l"]
swap_pane_left = "prefix+shift+left"  # iTerm2: cmd+alt+arrow.
swap_pane_down = "prefix+shift+down"
swap_pane_up = "prefix+shift+up"
swap_pane_right = "prefix+shift+right"
# Navigate mode (workspace picker): the arrows, and i j k l (i = up, j = left, k = down, l = right).
navigate_pane_left = "j"
navigate_pane_down = "k"
navigate_pane_up = "i"
navigate_pane_right = "l"
split_vertical = "prefix+d"           # iTerm2 cmd+d: new pane on the right
split_horizontal = "prefix+shift+d"   # iTerm2 cmd+shift+d: new pane below
close_pane = "prefix+x"
zoom = "prefix+f"                     # iTerm2: cmd+enter.
resize_mode = ["prefix+minus", "prefix+="] # AeroSpace Hyper+- / Hyper+=. cmd+- / cmd+= stay the font size.
last_pane = "prefix+tab"              # back and forth, like AeroSpace Hyper+tab
cycle_pane_next = ""
cycle_pane_previous = ""
rename_pane = "prefix+ctrl+r"

# Tabs: browser and VS Code tabs
new_tab = "prefix+t"                  # cmd+t
close_tab = "prefix+w"                # cmd+w
rename_tab = "prefix+r"
next_tab = "prefix+ctrl+right"        # ctrl+tab in the iTerm2 "herdr" profile
previous_tab = "prefix+ctrl+left"     # ctrl+shift+tab in the iTerm2 "herdr" profile
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"
switch_tab = "prefix+1..9"            # cmd+1..9

# Workspaces: shift + the tab key
new_workspace = "prefix+shift+t"
close_workspace = "prefix+shift+w"    # cmd+shift+w closes the window
rename_workspace = "prefix+shift+r"
next_workspace = "prefix+ctrl+down"   # ctrl+alt+tab in the iTerm2 "herdr" profile
previous_workspace = "prefix+ctrl+up" # ctrl+alt+shift+tab in the iTerm2 "herdr" profile
# Worktrees are workspaces too, so they use shift: G new, O open, X remove.
new_worktree = "prefix+shift+g"       # g = git
open_worktree = "prefix+shift+o"      # o = open an existing checkout
remove_worktree = "prefix+shift+x"    # x = delete the checkout (git worktree remove). Asks first.

# Fork the agent of the focused pane (Claude Code: --resume <session> --fork-session).
# Rule: ctrl + the key that creates a split or a tab = the same, with a fork of the agent.
# iTerm2 herdr profile: cmd+ctrl+d (right), cmd+ctrl+shift+d (below), cmd+ctrl+t (tab),
# cmd+ctrl+x (close and stop).
[[keys.command]]
key = "prefix+ctrl+d"                 # fork into a new pane on the right
type = "shell"
command = "\"$HOME/.config/herdr/scripts/fork-agent\" right"

[[keys.command]]
key = "prefix+ctrl+shift+d"           # fork into a new pane below
type = "shell"
command = "\"$HOME/.config/herdr/scripts/fork-agent\" down"

[[keys.command]]
key = "prefix+ctrl+t"                 # fork into a new tab
type = "shell"
command = "\"$HOME/.config/herdr/scripts/fork-agent\" tab"

# A fork of a conversation that runs in the background (claude --bg, /resume) also runs in the
# background: x only closes its client. ctrl+x stops the background session, then closes the pane.
[[keys.command]]
key = "prefix+ctrl+x"                 # close the pane and stop its background Claude Code session
type = "shell"
command = "\"$HOME/.config/herdr/scripts/close-agent\""

# Send /reload-plugins to each Claude Code agent, for example after `pac upgrade agents`.
# iTerm2 herdr profile: cmd+ctrl+u. A new version of Claude Code needs a restart instead:
# `herdr server stop`, then `herdr` resumes each agent with `claude --resume <id>`.
[[keys.command]]
key = "prefix+ctrl+u"                 # u = update the plugins
type = "shell"
command = "\"$HOME/.config/herdr/scripts/reload-plugins\""

# The herdr-bar plugin (github:jeffarese/herdr-bar) finds a tab, a pane or an agent and goes to it.
# iTerm2 herdr profile: cmd+p, like the quick open of VS Code.
[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[theme]
name = "dracula"
auto_switch = false
