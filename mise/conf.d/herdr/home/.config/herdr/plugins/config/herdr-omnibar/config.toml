# Config of the herdr plugin herdr-omnibar. herdr gives this folder to the plugin
# (`herdr plugin config-dir herdr-omnibar`). Each key has its value, also the default value.

# The size of the popup (default: "default"):
# - "default": 74 % x 62 % of the window, like the other popups.
# - "big": 90 % x 80 % of the window.
size = "default"

# The folders of the git projects, 2 levels deep. zoxide adds its folders too.
roots = ["~/Workspace", "~/workspace", "~/projects", "~/src", "~/code", "~/dev", "~/repos"]

# The preview of a worktree (default: "full"):
# - "full": 3 views, diff, log and changes. ctrl+Left and ctrl+Right change the view.
# - "summary": one view.
preview = "full"

# The ends of the pills: the current filter, the crumb, the places of the action line
# (default: "square"):
# - "square": half blocks, square corners and a thin space on each side.
# - "round": half circles. The font of the terminal must be a Nerd Font.
# - "flat": a space on each side.
pills = "square"

# The optional features. Remove a name to turn its feature off.
# Default: ["mouse", "rename_tab", "auto_titles", "agent_logos", "recent_first"].
# - running_time (off by default): the running time of each agent and command.
# - pull_requests (off by default): the pull request of each branch (gh), as a badge and as the
#   view PR of the preview.
features = ["mouse", "rename_tab", "auto_titles", "agent_logos", "recent_first", "pull_requests"]

# The filters of the chips, in the order of Tab. Remove a name to hide its filter: its action
# still opens it. Its shortcut (@ & * # + > %) works only for a filter of this list.
# Default: ["all", "agents", "tabs", "workspaces", "worktrees", "folders", "new", "actions"].
# - panes (off by default): one row for each pane of each tab. % opens it.
filters = ["all", "agents", "workspaces", "worktrees", "folders", "new", "actions"]
