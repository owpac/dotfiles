# Config of the herdr plugin owpac/herdr-worktrunk. herdr gives this folder to the plugin
# (`herdr plugin config-dir herdr-worktrunk`). Each key has its value, also the default value.

# Start the observer with herdr (default: true). The observer moves the pane of an agent to the
# workspace of its worktree, and closes the workspace of a removed worktree. It reads this file
# when it starts: after a change, run pkill -f 'herdr-worktrunk observe --run'.
observe = true

# The observer removes the worktree of each merged or closed pull request, every 5 minutes. It also
# removes the worktree of a branch in the default branch: at once if the branch has its own
# commits, else after 1 day without agent. It closes the idle agents of the worktree first, and
# keeps a worktree where an agent works. Then it closes the workspace and shows a notification.
# Needs the CLI of the forge: gh, glab, tea or az (default: false).
prune_merged = true

# A notification names each worktree without pull request and without change for this number of
# days, once in this number of days (default: 0, off). The cleaner uses this number for its rule
# "no pull request" (7 if 0). prefix+shift+c (cmd+shift+c in the iTerm2 profile herdr) opens the
# cleaner at any time.
stale_days = 7

# The size of the picker, the cleaner and the merger (default: "default"):
# - "default": the size of the other popups (herdr-omnibar), 74 % x 62 % of the window.
# - "big": 90 % x 80 % of the window.
popup_size = "default"

# The cleaner fetches origin before its checks, so the integration and the push state see the
# last state of the remote (default: false). The fetch can ask the ssh agent (1Password) for a
# key. The versions of the plugin before the layers of proof ignore this key.
fetch_before_check = false
