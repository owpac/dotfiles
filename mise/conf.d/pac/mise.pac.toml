# The module pac: the CLI that upgrades each machine (owpac/pac). mise installs it with uv, in its
# own venv, from its private GitHub repository. mise 2026.10.19 or later lists a private
# repository with `git ls-remote` over SSH, so no GitHub token is necessary. On a server (the
# NAS, the Pi), ssh forwards the 1Password agent of the Mac (ForwardAgent).
# A machine without access to this repository uses a set without this module (miserc.toml).

# A git tag has no release date, so mise cannot check the delay of minimum_release_age, and it
# shows a warning at each install. The tags of this repository come from its own workflow, so
# the tool skips the delay. Its dependencies from PyPI also skip it.
[settings]
minimum_release_age_excludes = ["pypi:git+ssh://git@github.com/owpac/pac.git"]

[tools]
# Python stays on one minor version. mise installs the Python tools with the link python/3.15. A
# new patch version keeps their venv, but a new minor version breaks it. The hook below then
# reinstalls the tool. The module kompose declares the same versions.
python = "3.15"
uv = "latest"
# On github.com, `latest` is the last tag. The workflow tag.yml of the repository tags each push on
# main, so `mise upgrade` installs each push. postinstall writes the zsh completion of each new
# version.
"pypi:git+ssh://git@github.com/owpac/pac.git" = { version = "latest", postinstall = 'mkdir -p "$HOME/.local/bin/completions" && pac --completion zsh > "$HOME/.local/bin/completions/_pac"' }

# pac reads one config file, ~/.config/pac/config.toml. The module pac merges the keys of pac that
# are not about the agents, and the module agents merges the keys of the agents ([agent]). The
# template enables the module inbox of pac only on a machine with the module agents: the Inbox
# needs bd and the plugin t3code. mise does not remove a merged key. On one machine,
# ~/.config/pac/config.local.toml wins over config.toml. A relative source starts in the folder of
# this file.
[dotfiles]
"~/.config/pac/config.toml/pac" = { source = "home/.config/pac/config.toml", merge = true, template = "tera" }

# A new minor version of Python breaks the venv of a Python tool, and mise does not reinstall the
# tool. So reinstall pac if it does not start. mise runs the hooks of each config file.
# Then write the zsh completion again. The completion shows only the active modules of pac. A
# module of the dotfiles can enable a module of pac after the postinstall: for example, the modules
# agents and pac merge [agent] and [inbox] enabled = true into ~/.config/pac/config.toml. mise
# applies the dotfiles before the tools, so this hook sees each key. The hook writes to a temporary
# file first, so an error keeps the old file. This error does not stop the bootstrap.
# mise 2026.10.22 or later prints the description instead of the script. The codes \u001b[…m
# print the name in green and bold, the color of the tools of owpac (see the task bootstrap), also in a pipe or with NO_COLOR.
[bootstrap.hooks.post-tools]
description = "\u001b[1;32m[pac]\u001b[0m 🔧 Reinstall pac if it does not start, then write its completion"
run = '''
if ! mise exec -- pac --version >/dev/null 2>&1; then
  echo "Reinstalling pac on the Python of mise..."
  mise install --force "pypi:git+ssh://git@github.com/owpac/pac.git"
fi
completion="$HOME/.local/bin/completions/_pac"
mkdir -p "${completion%/*}"
if mise exec -- pac --completion zsh > "$completion.tmp"; then
  mv "$completion.tmp" "$completion"
else
  rm -f "$completion.tmp"
  echo "pac --completion zsh failed: the old completion stays." >&2
fi
'''
