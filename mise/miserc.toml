# The settings that mise reads before the config files. miserc.local.toml, next to this file,
# holds the roles and the modules of this machine: the task modules writes it, and git ignores it.
#
# auto_env = false: mise adds no platform environment (unix, macos, linux, macos-arm64). So a file
# named after a platform, such as conf.d/macos/mise.macos.toml, loads only when the machine
# selects the module of the same name. mise 2027.6.0 turns auto_env on by default: this line
# keeps the current behavior, and stops the warning of mise about platform files.
auto_env = false
