# Global config of mise. ~/.config/mise is one link to mise/ of this repository, as
# `mise bootstrap --config-dir mise` makes it (install.sh creates this link). So each mise command
# reads this config, from any directory. `mise use --global` and
# `mise bootstrap packages use --global` write their changes here, through the link. The local
# files of this machine (miserc.local.toml, config.local.toml) are in mise/ too: git ignores them.
#
# This file applies to each machine. A machine selects its setup on 3 axes:
#   - Roles: the type of machine. minimal (containers, Codespaces), server (the NAS and the
#     Raspberry Pi), workstation (a Mac) and work (a Mac for Doctolib, with workstation). A role is
#     a config environment: config.<role>.toml holds its setup and lists its modules
#     (vars.modules_<role>).
#   - Modules: the blocks of setup that a machine turns on as a whole, for example herdr or agents.
#     A module is a config environment too: conf.d/<module>/mise.<module>.toml holds all its setup.
#     vars.modules_base lists the modules of each machine.
#   - Systems: macos or linux. A module keeps its system variants: `os` on an entry, `os()` in a
#     template. miserc.toml sets auto_env = false: mise adds no platform environment.
# The machine saves its roles (vars.roles). The task modules writes the roles and the modules
# into miserc.local.toml, for example env = ["workstation", "zsh", "git", "ssh"]. Do not edit
# this file: the task writes it again.
# Change the roles of a machine: mise vars roles="workstation work", then run
# `mise run --skip-tools modules`, then `mise bootstrap --prune-dotfiles`.
#
# A folder of conf.d/ holds a module. mise.<module>.toml declares its dotfile group, its
# templates, its packages, its merges and its tasks. mise reads this file only when the machine
# selects the module, and reads no other file of the folder. home/ holds the files of the group,
# at their path in the home directory. mise links each file
# (conf.d/herdr/home/.config/herdr/config.toml to ~/.config/herdr/config.toml), and renders the
# templates that the group lists. tasks/ holds the setup scripts of the module, and data/ the
# files that its tasks read.
# A module keeps its role variants: "work" in mise_env in a template, env = "work" on a package,
# variants = [{ profile = "work" }] on a whole file. A role and a module never have the same name.
#
# How to change the dotfiles:
#   - Edit a link in place: the change goes into this repository.
#   - Edit a template in home/, then run `mise dot apply`.
#   - Add a file to a group: mise dot add --group <group> <file>
#   - Remove a file: remove its source, then run `mise dot apply --prune`.
#   - Add a module: add its folder, with its group in mise.<module>.toml and its files in home/.
#     Add the module to the list of a role. On each machine, run `mise bootstrap --update`, then
#     `mise run --skip-tools modules`, then `mise bootstrap`.
#
# Apply the setup: mise bootstrap
# Pull this repository, then apply it: mise bootstrap --update --prune-dotfiles
#   mise fast-forwards this repository, then runs again with the new config. --prune-dotfiles
#   removes the files that a group does not deploy any more, for example after the pull removed a
#   module. mise asks before it removes a file.
#   If the pull changes the modules of a role, the task modules must write the new list: run
#   `mise run --skip-tools modules`, then `mise bootstrap --prune-dotfiles`. Before a task, mise
#   installs all the tools of the config, and --skip-tools stops this step: the task needs no tool.
# See the changes first: mise bootstrap --dry-run, mise dot diff, mise bootstrap status

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node", "terraform"]
# The root of the dotfile groups: the group zsh reads conf.d/zsh/home. The path goes into this
# repository, not through the link ~/.config/mise, so the links of the dotfiles point directly to
# the files of this repository.
dotfiles.root = "~/.dotfiles/mise/conf.d"
# The history of mise (mode track, mise dot save, history-watch) keeps versions of the files that
# it tracks in place. This repository and git do this work, so the history stays off, and mise dot
# status does not show its empty sections.
history.enabled = false
# mise skips the versions that are younger than 3 days (default: 24h). The delay limits the risk of
# a compromised release. It applies when mise resolves `latest` or a prefix such as "3.15", to the
# dependencies of the npm and pypi tools, and to mise self-update. It does not apply to an exact
# version, to a version without a release date (pac and kompose from git), or to the packages of
# mise bootstrap (Homebrew, apt).
minimum_release_age = "3d"

[vars]
# The answers of each machine. mise asks for them once (mise vars prompt, or
# mise bootstrap --prompt-vars) and keeps them in its state directory, outside this repository.
full_name = { default = "", prompt = "Full name" }
# The GitHub noreply address keeps the real email out of the public commits. It is public, and
# it rejects the incoming mail.
email = { default = "29702840+owpac@users.noreply.github.com", prompt = "Email" }
email_work = { default = "29702840+owpac@users.noreply.github.com", prompt = "Work email" }

# The age identity that decrypts the .age files of this repository. 1Password holds it.
age_identity = { default = "{{ env.HOME }}/.ssh/encryption_ed25519" }

# The roles of this machine, separated by spaces: minimal, server, workstation, work. install.sh
# saves the answer, and `mise vars roles="workstation work"` changes it. A saved answer replaces a
# default, not a fixed value: so this var and modules_off have a default.
roles = { default = "minimal", prompt = "Roles (minimal, server, workstation, work), separated by spaces" }
# The modules of each machine. Each file of a role adds its modules (vars.modules_<role>).
modules_base = "zsh git"
# The modules that this machine turns off, separated by spaces: mise vars modules_off="raycast"
modules_off = { default = "" }
