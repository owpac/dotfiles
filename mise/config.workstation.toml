# The role workstation: a Mac, in the personal mode and in the work mode. The tools and the
# packages without a module, and the task bootstrap. The module macos holds the setup of macOS.

# The modules of this role. The task modules adds them to the modules of config.toml.
[vars]
modules_workstation = "macos ssh secrets pac aerospace agents herdr raycast iterm2"

# Python and uv come with the module pac.
[tools]
node = "latest"
hk = "latest"

# mise installs the Homebrew formulae itself, in /opt/homebrew, with the receipts of Homebrew:
# `brew upgrade` sees them. mise sees the packages that Homebrew installed.
# homebrew_metadata: after mise installs a cask, it also writes the metadata of Homebrew. Homebrew
# then owns the cask, and `brew upgrade` sees it. A cask of a third-party tap (aerospace) stays
# with mise: `mise bootstrap packages upgrade` upgrades it. This setting needs the first release of
# mise after 2026.10.19.
[bootstrap.brew]
homebrew_metadata = true

# The packages of a module are in the file of the module.
[bootstrap.packages]
"brew:colima" = "latest"
"brew:displayplacer" = "latest"
"brew:docker" = "latest"
"brew:docker-compose" = "latest"
"brew:fzf" = "latest"
"brew:git" = "latest"
"brew:gh" = "latest"
"brew:htop" = "latest"
"brew:mas" = "latest"
"brew:mise" = "latest"
"brew:mole" = "latest"
"brew:mtr" = "latest"
"brew:nmap" = "latest"
# npm comes with node. Homebrew installs node for its alias npm. mise also installs node
# ([tools]): check if this package is still useful.
"brew:node" = "latest"
"brew:tree" = "latest"
"brew:zoxide" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:1password-cli" = "latest"
"brew-cask:appcleaner" = "latest"
"brew-cask:discord" = "latest"
"brew-cask:elgato-stream-deck" = "latest"
"brew-cask:elgato-wave-link" = "latest"
"brew-cask:firefox" = "latest"
"brew-cask:font-jetbrains-mono-nerd-font" = "latest"
"brew-cask:obsidian" = "latest"
"brew-cask:readdle-spark" = "latest"
"brew-cask:rectangle" = "latest"
"brew-cask:signal" = "latest"
"brew-cask:spotify" = "latest"
"brew-cask:thaw" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:zen" = "latest"

[dotfiles]
"~/Workspace" = { permissions = "0700" }

# The setup that the sections above do not cover: the scripts in the tasks/ folders of the
# modules. mise bootstrap runs this task after the other steps, one script after the other.
# mise loads the task of a module only when the machine selects the module: the loop skips the
# tasks that mise does not find.
[tasks.bootstrap]
description = "Run the setup scripts of a workstation"
raw = true
run = '''
for task in agents herdr-plugins macos-setup macos-preferences backups claude-token; do
  mise tasks info "$task" >/dev/null 2>&1 || continue
  mise run "$task" || exit 1
done
'''
